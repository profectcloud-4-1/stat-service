server:
  port: ${SERVER_PORT}

spring:
  application:
    name: stat-service

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    review:
      raw:
        driver-class-name: ${REVIEW_RAW_DB_DRIVER}
        url: ${REVIEW_RAW_DB_URL}
        username: ${REVIEW_RAW_DB_USERNAME}
        password: ${REVIEW_RAW_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.springframework.batch: INFO
