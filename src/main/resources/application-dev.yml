server:
  port: ${SERVER_PORT}

spring:
  application:
    name: stat-service

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.springframework.batch: INFO
      org.springframework.jdbc: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        pushgateway:
          enabled: true
          push-rate: 3s







